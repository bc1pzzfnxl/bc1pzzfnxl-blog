name: Content sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    # Enable the schedule with a repository variable CONTENT_SYNC=true once the
    # three secrets below exist. Manual runs always work.
    if: github.event_name == 'workflow_dispatch' || vars.CONTENT_SYNC == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Write deploy config
        run: printf '%s' "${{ secrets.WRANGLER_DEPLOY_CONFIG }}" > wrangler.deploy.jsonc

      - name: Sync content from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPO_PRIVATE" = "true" ]; then
            bun run content:sync -- --config=wrangler.deploy.jsonc --all
          else
            bun run content:sync -- --config=wrangler.deploy.jsonc
          fi

      - name: Commit the mirror
        run: |
          git config user.name "content-sync"
          git config user.email "content-sync@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "No content changes."
            exit 0
          fi
          git commit -m "chore(content): sync from D1"
          git push
